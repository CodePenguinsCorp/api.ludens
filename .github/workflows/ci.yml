name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    uses: CodePenguinsCorp/pipelines.ludens/.github/workflows/_test.yaml@master
    with:
      working-directory: .
      compose-file: docker/docker-compose.Staging.yml

  build:
    needs: test
    uses: CodePenguinsCorp/pipelines.ludens/.github/workflows/_build.yaml@master
    with:
      image-name: api-ludens:ci
